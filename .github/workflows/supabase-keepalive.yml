name: Supabase Keepalive

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoints
        env:
          PROD_URL: https://rpkhiemljhncddmhrilk.supabase.co
          STAGING_URL: https://bhtkzhgrcjxfweblbfjv.supabase.co
          PROD_KEY: ${{ secrets.SUPABASE_PROD_ANON_KEY }}
          STAGING_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
        run: |
          FAILED=0

          ping() {
            local name="$1"
            local url="$2"
            local key="$3"
            local code

            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$url/rest/v1/keepalive_ping" -H "apikey: $key" -H "Authorization: Bearer $key" || echo "000")

            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "$name responded with $code, retrying in 90s..."
              sleep 90
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                "$url/rest/v1/keepalive_ping" -H "apikey: $key" -H "Authorization: Bearer $key" || echo "000")
            fi

            echo "$name: HTTP $code"

            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              FAILED=1
            fi
          }

          ping "Roastr prod" "$PROD_URL" "$PROD_KEY"
          ping "Roastr Staging" "$STAGING_URL" "$STAGING_KEY"

          exit $FAILED
